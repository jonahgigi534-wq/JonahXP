<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JonahXP</title>
<meta name="description" content="Portfolio of Jonathan (Jonah) Gigi: desktop apps, machine learning and embedded hardware.">
<link rel="stylesheet" href="css/base.css?v=18">
<link rel="stylesheet" href="css/cursors.css?v=18">
<link rel="stylesheet" href="css/boot.css?v=18">
<link rel="stylesheet" href="css/desktop.css?v=18">
<link rel="stylesheet" href="css/window.css?v=18">
<link rel="stylesheet" href="css/taskbar.css?v=18">
<link rel="stylesheet" href="css/apps.css?v=18">
<link rel="stylesheet" href="css/game.css?v=18">
<link rel="stylesheet" href="css/crt.css?v=18">
</head>
<body class="is-booting">

<!-- 1. Boot splash -->
<div id="splash" class="splash">
  <div class="splash-center">
    <div class="splash-brand" id="splashBrand"></div>
    <div class="splash-bar"><span class="splash-bar-blocks"></span></div>
  </div>
  <p class="splash-hint">For the best experience<br>Enter Full Screen (F11)</p>
  <p class="splash-mark">Portfolio<sup>&reg;</sup></p>
</div>

<!-- 2. Login / welcome screen -->
<div id="boot" class="boot" hidden>
  <div class="boot-body">
    <p class="boot-welcome" aria-live="polite">welcome</p>

    <div class="boot-left">
      <div class="boot-brand" id="bootBrand"></div>
      <p class="boot-prompt">To begin, click on Jonah to log in</p>
    </div>

    <div class="boot-divider" aria-hidden="true"></div>

    <div class="boot-right">
      <button class="boot-user" id="bootUser" aria-label="Log in as Jonah">
        <span class="boot-user-pic" id="bootPic"></span>
        <span class="boot-user-meta">
          <span class="boot-user-name">Jonah</span>
          <span class="boot-user-role">Jonathan Gigi</span>
        </span>
      </button>
    </div>
  </div>

  <button class="boot-restart" id="bootRestart">
    <span class="boot-restart-icon" id="bootRestartIcon"></span>
    Restart JonahXP
  </button>
  <p class="boot-note">
    After you log on, the desktop is yours to explore.<br>
    Every window is a real project.
  </p>
</div>

<!-- 3. Desktop -->
<div id="screen" class="screen" hidden>
  <div class="wallpaper" aria-hidden="true"></div>

  <div class="icons" id="desktopIcons"></div>
  <div id="windows" class="windows"></div>

  <div class="taskbar">
    <button class="start-btn" id="startBtn">
      <span class="start-flag" id="startFlag"></span>
      <span class="start-label">start</span>
    </button>
    <div class="task-list" id="taskList"></div>
    <div class="tray">
      <span class="tray-icons" id="trayIcons"></span>
      <span class="tray-clock" id="clock">12:00 PM</span>
    </div>
  </div>

  <div class="start-menu" id="startMenu" hidden></div>
</div>

<!-- CRT / VHS overlay for the boot screens (css/crt.css) -->
<div class="crt" aria-hidden="true">
  <div class="crt-effect"></div>
  <div class="crt-scanline"></div>
  <div class="crt-flicker"></div>
  <div class="crt-vignette"></div>
  <div class="crt-noise"></div>
  <div class="crt-aberration"></div>
  <div class="crt-persistence"></div>
</div>

<script src="js/icons.js?v=18"></script>
<script src="js/brand.js?v=18"></script>
<script src="js/avatar.js?v=18"></script>
<script src="js/audio.js?v=18"></script>
<script src="js/data.js?v=18"></script>
<script src="js/windows.js?v=18"></script>
<script src="js/game/textures.js?v=18"></script>
<script src="js/game/world.js?v=18"></script>
<script src="js/game/blockcraft.js?v=18"></script>
<script src="js/apps.js?v=18"></script>
<script src="js/desktop.js?v=18"></script>
<script src="js/taskbar.js?v=18"></script>
<script src="js/startmenu.js?v=18"></script>
<script src="js/boot.js?v=18"></script>
<script src="js/main.js?v=18"></script>
</body>
</html>
